%YAML:1.0
---
# ETH3D RGB-D f2f production config (winner from regularizer sweep, 2026-06-02).
# S3 variant: eigenvalue clamp [0.001, 1.0], NO ℓ²·I.
# Mean RPE on 3 seqs: 0.0094 vs paper G-CVO-2 mean 0.0066 (within 30%).
l_init: 0.1
l_min: 0.05
amplitude: 0.1
sparsity_cutoff: 0.0001
c_l: 0.1
c_amplitude: 1
max_iterations: 500
tol: 0.00005
tol_2: 0.000012
max_neighbors: 128
l_decay_rate: 0.8
l_decay_start: 10
indicator_window: 10
indicator_threshold: 0.0001
use_geometry: 1
use_features: 1
kernel_type: 1                    # DENSE anisotropic
kernel_eval_max_dist: 0.25        # matches paper 2nd-order setting
neighbor_decay: 1
verbose: 0
use_connection_term: 1
use_ell2_in_kernel: 0             # OFF for ETH3D (opposite of KITTI; bias compounds indoors)
cov_eig_min: 0.001                # tight clamp critical; 0.01 breaks tracking
cov_eig_max: 1.0
