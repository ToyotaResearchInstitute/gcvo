%YAML:1.0
---
# ETH3D v3: drop ℓ²·I + soften eig clamp, since easier seqs are now over-regularized.
l_init: 0.1
l_min: 0.05
amplitude: 0.1
sparsity_cutoff: 0.0001
c_l: 0.1
c_amplitude: 1
max_iterations: 500
tol: 0.00005
tol_2: 0.000012
max_neighbors: 128
l_decay_rate: 0.8
l_decay_start: 10
indicator_window: 10
indicator_threshold: 0.0001
use_geometry: 1
use_features: 1
kernel_type: 1
kernel_eval_max_dist: 0.25
neighbor_decay: 1
verbose: 0
use_symmetrization: 0
use_connection_term: 1
use_ell2_in_kernel: 0             # DISABLED
cov_eig_min: 0.0                  # disabled
cov_eig_max: 0.0                  # disabled
